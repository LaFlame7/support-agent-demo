name: eval-claude

# Model evals cost money, so they run on demand (e.g. before merging a prompt change), not on every push.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run judge:calibrate -- --judge claude --gate
      - run: npm run eval -- --proposer claude
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: evals/reports/
